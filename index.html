<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Volleyball Ref Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Volleyball Ref Tracker</h1>
  <div class="toolbar">
    <button id="undo">Undo</button>
    <button id="swap">Swap sides</button>
    <button id="reset">New set</button>
  </div>
</header>
<main id="teams"></main>
<p class="hint">Tap a player number to edit it. Point to the serving team adds a point. Point to the receiving team is a side-out: they gain the serve and rotate.</p>
<script src="app.js"></script>
</body>
</html>
